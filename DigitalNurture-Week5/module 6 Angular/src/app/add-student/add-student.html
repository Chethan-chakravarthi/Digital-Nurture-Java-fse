<div class="container">
  <h1>Add Student</h1>

  <form [formGroup]="studentForm" (ngSubmit)="saveStudent()">
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" formControlName="name" placeholder="Name" />
      <div *ngIf="studentForm.get('name')?.touched && studentForm.get('name')?.invalid">
        Name is required.
      </div>
    </div>

    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" formControlName="username" placeholder="Username" />
      <div *ngIf="studentForm.get('username')?.touched && studentForm.get('username')?.invalid">
        Username is required.
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" formControlName="email" placeholder="Email" />
      <div *ngIf="studentForm.get('email')?.touched && studentForm.get('email')?.invalid">
        A valid email is required.
      </div>
    </div>

    <button type="submit" [disabled]="studentForm.invalid">Save</button>
  </form>

  <div class="response" *ngIf="responseMessage">
    {{ responseMessage }}
  </div>
</div>
