<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bootstrap Buttons</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="buttons.css">

</head>

<body>

<div class="container mt-5">

<h1 class="text-center text-primary mb-4">
Bootstrap Buttons
</h1>

<div class="text-center">

<button class="btn btn-primary m-2">Primary</button>

<button class="btn btn-success m-2">Success</button>

<button class="btn btn-danger m-2">Danger</button>

<button class="btn btn-warning m-2">Warning</button>

<button class="btn btn-info m-2">Info</button>

<button class="btn btn-dark m-2">Dark</button>

</div>

<hr>

<h3 class="text-center mt-4">Outline Buttons</h3>

<div class="text-center">

<button class="btn btn-outline-primary m-2">Primary</button>

<button class="btn btn-outline-success m-2">Success</button>

<button class="btn btn-outline-danger m-2">Danger</button>

</div>

<hr>

<h3 class="text-center mt-4">Button Sizes</h3>

<div class="text-center">

<button class="btn btn-primary btn-lg m-2">
Large Button
</button>

<button class="btn btn-success m-2">
Default Button
</button>

<button class="btn btn-danger btn-sm m-2">
Small Button
</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
