<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bootstrap Cards</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="cards.css">

</head>

<body>

<div class="container mt-5">

<h1 class="text-center text-primary mb-5">
Bootstrap Cards
</h1>

<div class="row">

<div class="col-md-4">

<div class="card shadow">

<img src="https://picsum.photos/300/200?random=1" class="card-img-top">

<div class="card-body">

<h4 class="card-title">
HTML5
</h4>

<p class="card-text">
HTML5 provides the structure of modern web pages.
</p>

<a href="#" class="btn btn-primary">
Learn More
</a>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<img src="https://picsum.photos/300/200?random=2" class="card-img-top">

<div class="card-body">

<h4 class="card-title">
CSS3
</h4>

<p class="card-text">
CSS3 is used to style beautiful and responsive websites.
</p>

<a href="#" class="btn btn-success">
Learn More
</a>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<img src="https://picsum.photos/300/200?random=3" class="card-img-top">

<div class="card-body">

<h4 class="card-title">
JavaScript
</h4>

<p class="card-text">
JavaScript adds interactivity and dynamic features.
</p>

<a href="#" class="btn btn-danger">
Learn More
</a>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
