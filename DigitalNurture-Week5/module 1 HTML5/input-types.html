<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Input Types</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>HTML5 Input Types</h1>

<section>

<label>Color</label><br>
<input type="color"><br><br>

<label>Date</label><br>
<input type="date"><br><br>

<label>Time</label><br>
<input type="time"><br><br>

<label>Email</label><br>
<input type="email" placeholder="Enter Email"><br><br>

<label>Number</label><br>
<input type="number" placeholder="Age"><br><br>

<label>Range</label><br>
<input type="range"><br><br>

<label>Search</label><br>
<input type="search" placeholder="Search"><br><br>

<label>Telephone</label><br>
<input type="tel" placeholder="Phone Number"><br><br>

<label>Website</label><br>
<input type="url" placeholder="https://example.com"><br><br>

</section>

<footer>

</footer>

</body>
</html>
