<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Student Registration Form</h1>

<section>

<form>

<label>Full Name</label><br>
<input type="text" placeholder="Enter your full name" required><br><br>

<label>Email Address</label><br>
<input type="email" placeholder="Enter your email" required><br><br>

<label>Password</label><br>
<input type="password" placeholder="Enter password" required><br><br>

<label>Mobile Number</label><br>
<input type="tel" placeholder="Enter mobile number"><br><br>

<label>Date of Birth</label><br>
<input type="date"><br><br>

<label>Gender</label><br>

<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other

<br><br>

<label>Skills</label><br>

<input type="checkbox"> HTML
<input type="checkbox"> CSS
<input type="checkbox"> JavaScript
<input type="checkbox"> Java

<br><br>

<label>Department</label><br>

<select>
    <option>CSE</option>
    <option>ECE</option>
    <option>EEE</option>
    <option>IT</option>
</select>

<br><br>

<label>Address</label><br>

<textarea rows="5" placeholder="Enter your address"></textarea>

<br><br>

<input type="submit" value="Register">
<input type="reset" value="Clear">

</form>

</section>

<footer>
© 2026 Cognizant Digital Nurture
</footer>

</body>
</html>
